name: FPE release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read release version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Generate site and registry
        run: npm run build
      - name: Run release candidate tests
        run: npm test
      - name: Check generated CSS is current
        run: git diff --exit-code -- css/fpe-theme.css
      - name: Package archives and verify contents
        run: |
          python3 scripts/package.py
          cd out
          sha256sum -c "SHA256SUMS-${{ steps.version.outputs.version }}.txt"
      - name: Upload validated build for review
        uses: actions/upload-artifact@v4
        with:
          name: fpe-validated-build
          path: |
            dist/
            out/*-v${{ steps.version.outputs.version }}.zip
            out/SHA256SUMS-${{ steps.version.outputs.version }}.txt
          retention-days: 14

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download release artifacts verified by same-commit job
        uses: actions/download-artifact@v4
        with:
          name: fpe-validated-build
          path: verified
      - name: Publish immutable version, never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$version" = "$VERSION" || { echo "::error::package.json version changed between jobs"; exit 1; }
          [[ "$version" =~ ^20[0-9]{2}\.(1[0-2]|[1-9])\.[0-9]+$ ]] || { echo "::error::Not a CalVer version: $version"; exit 1; }
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            if [ "$published_sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already belongs to $published_sha; this source is $GITHUB_SHA. Bump package.json and both plugin versions before merging."
              exit 1
            fi
            existing_assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in "fpe-design-system-source-v${version}.zip" "fpe-claude-v${version}.zip" "fpe-chatgpt-v${version}.zip" "SHA256SUMS-${version}.txt"; do
              if ! grep -Fxq "$asset" <<< "$existing_assets"; then
                echo "::error::$tag points at this commit but is missing $asset."
                exit 1
              fi
            done
            echo "$tag is already published for this exact commit with all four assets. No overwrite."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent >/dev/null 2>&1; then
            echo "::error::$tag exists without a published release. Refusing to attach new assets to an existing tag."
            exit 1
          fi
          (cd verified/out && sha256sum -c "SHA256SUMS-${version}.txt")
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          gh release create "$tag" \
            --verify-tag \
            "verified/out/fpe-design-system-source-v${version}.zip" \
            "verified/out/fpe-claude-v${version}.zip" \
            "verified/out/fpe-chatgpt-v${version}.zip" \
            "verified/out/SHA256SUMS-${version}.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FPE Design System v${version}" \
            --notes-file "docs/RELEASE_NOTES-${version}.md"

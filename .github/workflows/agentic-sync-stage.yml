name: Stage Agentic Workflow sync (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  stage:
    if: github.repository == 'ogfrench/fpe-design-system' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/reconcile-release-and-compatibility-20261117'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/reconcile-release-and-compatibility-20261117
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check accepted upstream main and stage managed copies
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 30c67a29cd8d896209f69b237a2e2f52568b47d2
        shell: bash
        run: |
          set -euo pipefail
          success="$(gh api -X GET "repos/ogfrench/agentic-coding-setup/actions/workflows/check.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$success" -gt 0 || { echo "Post-merge upstream main CI not accepted"; exit 1; }
          source_dir="$RUNNER_TEMP/agentic-source"
          git clone --quiet --depth=1 --branch main https://github.com/ogfrench/agentic-coding-setup.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_SHA"
          backup="$RUNNER_TEMP/sync-before"
          mkdir -p "$backup"
          if test -f .claude/settings.json; then cp .claude/settings.json "$backup/settings.json"; fi
          if test -d .claude/skills; then find .claude/skills -type f -print0 | sort -z | xargs -0 -r sha256sum > "$backup/own-skills.sha256"; fi
          if test -d .claude/rules; then find .claude/rules -type f -print0 | sort -z | xargs -0 -r sha256sum > "$backup/own-rules.sha256"; fi
          for file in AGENTS.md CLAUDE.md; do
            if [ -f "$file" ]; then cp "$file" "$backup/$file"; fi
          done
          node "$source_dir/lib/apply.mjs" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/managed-paths.txt"
          node - "$backup" "$GITHUB_WORKSPACE" "$SOURCE_SHA" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const [backup, target, sourceSha] = process.argv.slice(2);
          const before = fs.existsSync(path.join(backup, 'settings.json')) ? JSON.parse(fs.readFileSync(path.join(backup, 'settings.json'))) : {};
          const after = JSON.parse(fs.readFileSync(path.join(target, '.claude/settings.json')));
          assert.deepEqual(after.enabledPlugins, before.enabledPlugins);
          assert.deepEqual(after.permissions, before.permissions);
          for (const [kind, hooks] of Object.entries(before.hooks ?? {})) {
            for (const hook of hooks) {
              assert.ok((after.hooks?.[kind] ?? []).some(x => JSON.stringify(x) === JSON.stringify(hook)));
            }
          }
          const expected = [];
          for (const name of ['AGENTS.md', 'CLAUDE.md']) {
            const existing = path.join(backup, name);
            const next = path.join(target, name);
            if (fs.existsSync(existing)) {
              expected.push(name);
              assert.ok(fs.readFileSync(next, 'utf8').startsWith(fs.readFileSync(existing, 'utf8')));
              assert.equal(fs.readFileSync(next, 'utf8').split('<!-- agentic-workflow:maintainer:start -->').length, 2);
            } else assert.ok(!fs.existsSync(next), 'do not invent a second instruction file');
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(target, '.claude/claude-code-setup.json')));
          assert.deepEqual(manifest.maintainer_entrypoints, expected);
          assert.equal(manifest.source_revision, sourceSha);
          NODE
          if test -f "$backup/own-skills.sha256"; then sha256sum -c "$backup/own-skills.sha256"; fi
          if test -f "$backup/own-rules.sha256"; then sha256sum -c "$backup/own-rules.sha256"; fi
          node "$source_dir/scripts/check-sync.mjs" "$GITHUB_WORKSPACE" --json
          ( find . -path './.git' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum ) > "$RUNNER_TEMP/first.sha"
          node "$source_dir/lib/apply.mjs" "$GITHUB_WORKSPACE" >/dev/null
          ( find . -path './.git' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum ) > "$RUNNER_TEMP/second.sha"
          cmp "$RUNNER_TEMP/first.sha" "$RUNNER_TEMP/second.sha"
          node "$source_dir/scripts/check-sync.mjs" "$GITHUB_WORKSPACE" --json
          rm .github/workflows/agentic-sync-stage.yml
          git add -A
          while IFS= read -r f; do
            case "$f" in
              AGENTS.md|CLAUDE.md|.mcp.json|.claude/*|.github/workflows/agentic-sync-stage.yml) ;;
              *) echo "Unexpected changed path: $f"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          # Vendored upstream Markdown contains intentional line-break spaces and blank lines.
          # Verify exact copies via the manifest, source pin and repeat-apply checks above.
          # Enforce whitespace hygiene on project-owned setup and instructions only.
          git diff --cached --check -- AGENTS.md CLAUDE.md .claude/agentic-workflow-sync.json .claude/settings.json .claude/claude-code-setup.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync Agentic Workflow managed copies'
          git push origin "HEAD:docs/reconcile-release-and-compatibility-20261117"

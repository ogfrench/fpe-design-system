name: FPE validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reference, CSS and registry
        run: npm run build
      - name: Validate tokens, assets, registry and packages
        run: npm test
      - name: Verify generated theme is in sync
        run: git diff --exit-code -- css/fpe-theme.css
      - name: Archive static reference for review
        uses: actions/upload-artifact@v4
        with:
          name: fpe-static-reference
          path: dist/
